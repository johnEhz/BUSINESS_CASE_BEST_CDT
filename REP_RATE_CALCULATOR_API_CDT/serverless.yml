service: rep-rate-calculator-api

provider:
  name: aws
  runtime: python3.12
  stage: prod
  region: us-east-1
  environment:
    DEFAULT_ENV: ${self:provider.stage}
    DB_HOST: ${env:DB_HOST}
    DB_PORT: ${env:DB_PORT}
    DB_USERNAME: ${env:DB_USERNAME}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_NAME: ${env:DB_NAME}
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME}
    MAX_FILE_SIZE_MB: ${env:MAX_FILE_SIZE_MB}
    ALLOWED_FILE_EXTENSIONS: ${env:ALLOWED_FILE_EXTENSIONS}
    CSV_DELIMITER: ${env:CSV_DELIMITER}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource: 
        - "arn:aws:s3:::${env:S3_BUCKET_NAME}/*"
        - "arn:aws:s3:::${env:S3_BUCKET_NAME}"

functions:
  uploadFile:
    handler: app/LMD_UPLOAD_FILE/handler.upload_file
    events:
      - http:
          path: /upload-file
          method: post

  processFile:
    handler: app/LMD_PROCESS_FILE/handler.process_s3_event
    events:
      - s3:
          bucket: ${env:S3_BUCKET_NAME}
          event: s3:ObjectCreated:*
          existing: true
          rules:
            - prefix: uploads/
            - suffix: .csv

plugins:
  - serverless-dotenv-plugin
  - serverless-python-requirements

custom:
  pythonRequirements:
    slim: true
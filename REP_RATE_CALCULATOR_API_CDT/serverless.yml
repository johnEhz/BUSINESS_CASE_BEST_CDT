service: rep-rate-calculator-api

provider:
  name: aws
  runtime: python3.12
  stage: prod
  region: us-east-1
  environment:
    DEFAULT_ENV: ${self:provider.stage}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource: 
        - "arn:aws:s3:::${env:S3_BUCKET_NAME}/*"
        - "arn:aws:s3:::${env:S3_BUCKET_NAME}"

functions:
  uploadFile:
    handler: app/LMD_UPLOAD_FILE/handler.upload_file
    events:
      - http:
          path: /upload-file
          method: post

plugins:
  - serverless-dotenv-plugin
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false
    slim: true
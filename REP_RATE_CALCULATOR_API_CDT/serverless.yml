service: rep-rate-calculator-api

provider:
  name: aws
  runtime: python3.12
  stage: prod
  region: us-east-1
  environment:
    DEFAULT_ENV: ${self:provider.stage}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource: 
        - "arn:aws:s3:::${env:S3_BUCKET_NAME}/*"
        - "arn:aws:s3:::${env:S3_BUCKET_NAME}"

functions:
  uploadFile:
    handler: app/LMD_UPLOAD_FILE/handler.upload_file
    events:
      - http:
          path: /upload-file
          method: post
    environment:
      S3_BUCKET_NAME: ${env:S3_BUCKET_NAME}
      MAX_FILE_SIZE_MB: ${env:MAX_FILE_SIZE_MB}
      ALLOWED_FILE_EXTENSIONS: ${env:ALLOWED_FILE_EXTENSIONS}
      CSV_DELIMITER: ${env:CSV_DELIMITER}

plugins:
  - serverless-dotenv-plugin

custom:
  pythonRequirements:
    dockerizePip: false
    slim: true
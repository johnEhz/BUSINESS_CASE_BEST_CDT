<div class="bg-white rounded-lg shadow-md p-6  h-full">
    <h2 class="text-2xl font-semibold text-purple-600 mb-4">Cuotas por Banco</h2>
    <form [formGroup]="quotasForm" (ngSubmit)="getBankQuotas()" class="flex flex-col gap-4 align-bottom">
        <div class="flex flex-col gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Monto</label>
                <input
                    formControlName="quotasAmount"
                    class="mt-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2"
                    [ngClass]="quotasForm.get('quotasAmount')?.invalid && quotasForm.get('quotasAmount')?.touched ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-purple-500'"
                    type="number" placeholder="5000000" />
                <p *ngIf="getFieldError('quotasAmount')" class="text-red-600 text-sm mt-1">{{ getFieldError('quotasAmount') }}</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Plazo (días)</label>
                <input
                    formControlName="quotasTermDays"
                    class="mt-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2"
                    [ngClass]="quotasForm.get('quotasTermDays')?.invalid && quotasForm.get('quotasTermDays')?.touched ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-purple-500'"
                    type="number" placeholder="90" />
                <p *ngIf="getFieldError('quotasTermDays')" class="text-red-600 text-sm mt-1">{{ getFieldError('quotasTermDays') }}</p>
            </div>
        </div>
        <button type="submit" [disabled]="!quotasForm.valid || quotasLoading"
            class="w-full bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 disabled:bg-gray-400 cursor-pointer">
            {{ quotasLoading ? 'Consultando...' : 'Consultar' }}
        </button>
    </form>

    <app-json-viewer [data]="quotasResults"></app-json-viewer>
    <div *ngIf="investedSummaryError" class="text-red-600 mt-2">{{ investedSummaryError }}</div>
</div>

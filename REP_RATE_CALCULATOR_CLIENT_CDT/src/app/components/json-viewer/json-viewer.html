<div class="bg-white border border-gray-200 rounded-lg shadow-sm">
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200">
        <h3 class="text-lg font-semibold text-gray-800">JSON Viewer</h3>
        <div class="flex items-center gap-2">
            <button
                class="bg-blue-600 text-white px-3 py-1.5 rounded hover:bg-blue-700 text-sm cursor-pointer"
                (click)="copyJson()"
                [disabled]="!data">
                Copiar
            </button>
            <button
                class="bg-gray-800 text-white px-3 py-1.5 rounded hover:bg-black text-sm cursor-pointer"
                (click)="downloadJson()"
                [disabled]="!data">
                Descargar
            </button>
        </div>
    </div>

    <div *ngIf="data" class="px-4 py-3 bg-gray-900 text-gray-100 text-sm rounded-b-lg overflow-auto max-h-80">
        <pre class="whitespace-pre leading-relaxed">{{ prettyJson }}</pre>
    </div>

    <div *ngIf="!data" class="px-4 py-6 text-gray-500 text-sm text-center">
        No hay datos para mostrar.
    </div>

    <div *ngIf="copySuccess" class="px-4 py-2 text-green-700 bg-green-50 border-t border-green-200 text-sm">
        Copiado al portapapeles.
    </div>
    <div *ngIf="copyError" class="px-4 py-2 text-red-700 bg-red-50 border-t border-red-200 text-sm">
        No se pudo copiar. Intenta de nuevo.
    </div>
</div>

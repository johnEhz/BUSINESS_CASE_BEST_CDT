<div class="bg-white rounded-lg shadow-md p-6">
    <h2 class="text-2xl font-semibold text-blue-600 mb-4">Calcular ROI</h2>
    <form [formGroup]="roiForm" (ngSubmit)="calculateRoi()" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Monto</label>
            <input
                formControlName="roiAmount"
                class="mt-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2"
                [ngClass]="roiForm.get('roiAmount')?.invalid && roiForm.get('roiAmount')?.touched ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-blue-500'"
                type="number" placeholder="5000000" />
            <p *ngIf="getFieldError('roiAmount')" class="text-red-600 text-sm mt-1">{{ getFieldError('roiAmount') }}</p>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Plazo (días)</label>
            <input
                formControlName="roiTermDays"
                class="mt-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2"
                [ngClass]="roiForm.get('roiTermDays')?.invalid && roiForm.get('roiTermDays')?.touched ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-blue-500'"
                type="number" placeholder="90" />
            <p *ngIf="getFieldError('roiTermDays')" class="text-red-600 text-sm mt-1">{{ getFieldError('roiTermDays') }}</p>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Base días/año</label>
            <input
                formControlName="roiBaseDays"
                class="mt-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2"
                [ngClass]="roiForm.get('roiBaseDays')?.invalid && roiForm.get('roiBaseDays')?.touched ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-blue-500'"
                type="number" placeholder="360" />
            <p *ngIf="getFieldError('roiBaseDays')" class="text-red-600 text-sm mt-1">{{ getFieldError('roiBaseDays') }}</p>
        </div>
        <button type="submit" [disabled]="!roiForm.valid || roiLoading"
            class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:bg-gray-400 cursor-pointer">
            {{ roiLoading ? 'Calculando...' : 'Calcular' }}
        </button>
    </form>
    <app-json-viewer [data]="roiResults"></app-json-viewer>
    <div *ngIf="roiLoadingError" class="text-red-600 mt-2">{{ roiLoadingError }}</div>
</div>
